services:
  db:
    image: postgres:16-alpine
    container_name: testata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: testata
      POSTGRES_PASSWORD: testata
      POSTGRES_DB: testata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  pgdata:
